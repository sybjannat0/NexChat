<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#d946ef"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Inner glow layer -->
  <rect x="24" y="24" width="464" height="464" rx="84" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- Main icon: Modern chat feather/quill with chat bubble -->
  <g filter="url(#glow)">
    <!-- Chat bubble shape -->
    <path d="M256 96c-88.366 0-160 59.047-160 132 0 39.63 21.158 74.994 54.336 98.003L126 384l58.994-35.857C203.363 353.226 228.989 360 256 360c88.366 0 160-59.047 160-132S344.366 96 256 96z" 
          fill="url(#iconGrad)" opacity="0.95"/>
    
    <!-- Feather/quill icon inside -->
    <g transform="translate(256, 228) rotate(-30)">
      <!-- Quill shaft -->
      <path d="M0 -80 Q20 -40 0 60 Q-10 20 -20 60 Q-20 0 0 -80Z" fill="url(#bgGrad)"/>
      <!-- Quill tip -->
      <ellipse cx="0" cy="65" rx="12" ry="8" fill="url(#bgGrad)"/>
      <!-- Detail lines -->
      <path d="M-8 -60 Q8 -30 0 40" stroke="rgba(255,255,255,0.3)" stroke-width="2" fill="none"/>
      <path d="M8 -50 Q-4 -25 0 30" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" fill="none"/>
    </g>
  </g>
  
  <!-- Decorative dots -->
  <circle cx="180" cy="180" r="8" fill="rgba(255,255,255,0.6)"/>
  <circle cx="332" cy="180" r="6" fill="rgba(255,255,255,0.4)"/>
  <circle cx="180" cy="320" r="6" fill="rgba(255,255,255,0.4)"/>
  <circle cx="332" cy="320" r="8" fill="rgba(255,255,255,0.5)"/>
  
  <!-- E2E lock indicator -->
  <g transform="translate(380, 400)">
    <circle cx="24" cy="24" r="32" fill="rgba(16, 185, 129, 0.9)"/>
    <path d="M24 14 L24 10 A10 10 0 0 1 34 18 L34 22 L14 22 L14 18 A10 10 0 0 1 24 10 L24 14 M18 22 L18 30 L30 30 L30 22" 
          stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
